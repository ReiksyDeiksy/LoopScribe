[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "loopscribe"
version = "0.1.0"
description = "Windows desktop application for loopback audio transcription."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.10",
  "faster-whisper>=1.2.1",
  "keyboard>=0.13.5",
  "numpy>=2.2.0",
  "platformdirs>=4.9.0",
  "soundcard>=0.4.3",
  "soundfile>=0.13.0",
]

[project.scripts]
loopscribe = "recorder_app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recorder_app = ["native/*.exe", "native/*.cs"]
